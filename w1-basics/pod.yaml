apiVersion: v1
kind: Pod
metadata:
  labels:
    run: nginx
    app: web
    tier: frontend
  name: nginx
spec:
  containers:
  - image: docker.m.daocloud.io/nginx
    name: nginx
    env:
    - name: "ENV"
      value: "env"
    command: ["sh", "-c", "echo start; nginx -g 'daemon off;'"]
    resources: 
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
    
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
